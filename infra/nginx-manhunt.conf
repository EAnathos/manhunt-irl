server {
    listen 80;
    server_name manhunt.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name manhunt.example.com;

    # SSL certs — adapt paths to your setup (e.g. Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/manhunt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manhunt.example.com/privkey.pem;

    # SvelteKit static build — adapt to your clone path
    root /root/eanathos/manhunt-irl/apps/frontend/build;
    index index.html;

    # Frontend static files — try files, then SPA fallback.
    # HTML must always be revalidated, otherwise browsers keep an old index.html
    # (and therefore the old app version) after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Service worker, manifest and version file: always revalidate so updates are seen
    location ~ ^/(service-worker\.js|manifest\.json|_app/version\.json)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output (file names change on every build): cache forever
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WS connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3003;
    }

    # Other static files (icons, music): short cache, NOT immutable (names don't change)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|mp3)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}
