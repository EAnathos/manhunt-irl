<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<style>
			/* Painted before any JS/CSS loads: no white flash, no white iOS overscroll */
			html, body { background: #0f0f0f; margin: 0; }

			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				background: #0f0f0f;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				transition: opacity 0.4s ease, visibility 0s linear 0.4s;
			}
			/* Soft red glow, dithered with grain so the dark gradient doesn't band */
			#splash::before {
				content: '';
				position: absolute;
				width: 160vmax;
				height: 160vmax;
				left: 50%;
				top: 46%;
				transform: translate(-50%, -50%);
				background: radial-gradient(closest-side, rgba(255, 68, 68, 0.16), rgba(255, 68, 68, 0.05) 45%, rgba(255, 68, 68, 0) 100%);
				animation: sp-fade 1.2s ease-out both;
			}
			#splash::after {
				content: '';
				position: absolute;
				inset: 0;
				opacity: 0.06;
				pointer-events: none;
				background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
			}
			#splash.leave {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#splash.leave .sp-mark {
				transform: scale(1.06);
				filter: blur(4px);
			}
			.sp-mark {
				position: relative;
				z-index: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				transition: transform 0.4s ease, filter 0.4s ease;
			}
			.sp-icon {
				width: 132px;
				height: 132px;
				overflow: visible;
			}
			.sp-ring {
				fill: none;
				stroke: #ff4444;
				transform-origin: 256px 256px;
				animation: sp-ring 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
			}
			.sp-ring.r1 { stroke-width: 10; animation-delay: 0.05s; }
			.sp-ring.r2 { stroke-width: 14; --o: 0.6; animation-delay: 0.15s; }
			.sp-ring.r3 { stroke-width: 18; --o: 0.3; animation-delay: 0.25s; }
			.sp-cross {
				stroke: #ff4444;
				stroke-width: 10;
				stroke-linecap: round;
				animation: sp-fade 0.6s 0.35s ease-out both;
			}
			.sp-dot {
				fill: #ff4444;
				transform-origin: 256px 256px;
				animation: sp-ring 0.5s ease-out both;
			}
			.sp-wave {
				fill: none;
				stroke: #ff4444;
				stroke-width: 4;
				transform-origin: 256px 256px;
				animation: sp-wave 1.6s 0.5s ease-out infinite;
				opacity: 0;
			}
			.sp-word {
				margin-top: 22px;
				font: 800 2.6rem/1 -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
				letter-spacing: -0.03em;
				color: #e8e8e8;
				animation: sp-up 0.6s 0.3s ease-out both;
			}
			.sp-word span { color: #ff4444; }
			.sp-tag {
				margin-top: 10px;
				font: 500 0.75rem/1 -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
				letter-spacing: 0.28em;
				text-transform: uppercase;
				color: #777;
				animation: sp-up 0.6s 0.45s ease-out both;
			}
			@keyframes sp-ring {
				from { opacity: 0; transform: scale(0.6); }
				to { opacity: var(--o, 1); transform: scale(1); }
			}
			@keyframes sp-wave {
				0% { opacity: 0.7; transform: scale(0.3); }
				100% { opacity: 0; transform: scale(1.9); }
			}
			@keyframes sp-up {
				from { opacity: 0; transform: translateY(10px); }
				to { opacity: 1; transform: none; }
			}
			@keyframes sp-fade {
				from { opacity: 0; }
				to { opacity: 1; }
			}
			@media (prefers-reduced-motion: reduce) {
				#splash *, #splash::before { animation: none !important; }
				.sp-wave { display: none; }
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" aria-hidden="true">
			<div class="sp-mark">
				<svg class="sp-icon" viewBox="0 0 512 512">
					<circle class="sp-wave" cx="256" cy="256" r="120" />
					<circle class="sp-ring r3" cx="256" cy="256" r="180" />
					<circle class="sp-ring r2" cx="256" cy="256" r="120" />
					<circle class="sp-ring r1" cx="256" cy="256" r="60" />
					<g class="sp-cross">
						<line x1="256" y1="30" x2="256" y2="160" />
						<line x1="256" y1="352" x2="256" y2="482" />
						<line x1="30" y1="256" x2="160" y2="256" />
						<line x1="352" y1="256" x2="482" y2="256" />
					</g>
					<circle class="sp-dot" cx="256" cy="256" r="14" />
				</svg>
				<div class="sp-word"><span>Man</span>Hunt</div>
				<div class="sp-tag">Chasse en conditions réelles</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var MIN_DISPLAY = 1100;
				var start = Date.now();
				function dismiss() {
					setTimeout(function () {
						var splash = document.getElementById('splash');
						var ready = function () { document.documentElement.classList.add('app-ready'); };
						if (!splash) return ready();
						splash.classList.add('leave');
						// Page content enters once the splash is nearly gone: no double logo cross-fade
						setTimeout(ready, 300);
						setTimeout(function () { splash.remove(); }, 450);
					}, Math.max(0, MIN_DISPLAY - (Date.now() - start)));
				}
				if (document.readyState === 'complete') dismiss();
				else window.addEventListener('load', dismiss);
			})();
		</script>
	</body>
</html>
