<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<style>
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				background: #0f0f0f;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 2.5rem;
				opacity: 1;
				transition: opacity 0.4s ease-out;
			}
			#splash.fade-out {
				opacity: 0;
				pointer-events: none;
			}
			#splash-logo {
				width: min(85vw, 340px);
				animation: splash-in 0.6s ease-out both;
				filter: drop-shadow(0 0 40px #ff444430);
			}
			@keyframes splash-in {
				from { opacity: 0; transform: scale(0.85) translateY(12px); }
				to   { opacity: 1; transform: scale(1) translateY(0); }
			}
			#splash-bar {
				width: min(60vw, 200px);
				height: 3px;
				background: #1a1a1a;
				border-radius: 3px;
				overflow: hidden;
				animation: splash-in 0.6s 0.5s ease-out both;
			}
			#splash-bar::after {
				content: '';
				display: block;
				height: 100%;
				width: 40%;
				background: linear-gradient(90deg, #ff4444, #44aaff);
				border-radius: 3px;
				animation: slide 1.4s ease-in-out infinite;
			}
			@keyframes slide {
				0% { transform: translateX(-100%); }
				100% { transform: translateX(350%); }
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash">
			<img id="splash-logo" src="/icon-wide.svg" alt="ManHunt" />
			<div id="splash-bar"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function() {
				var MIN_DISPLAY = 1200;
				var start = Date.now();
				function dismiss() {
					var elapsed = Date.now() - start;
					var delay = Math.max(0, MIN_DISPLAY - elapsed);
					setTimeout(function() {
						var splash = document.getElementById('splash');
						if (splash) {
							splash.classList.add('fade-out');
							setTimeout(function() { splash.remove(); }, 450);
						}
					}, delay);
				}
				if (document.readyState === 'complete') dismiss();
				else window.addEventListener('load', dismiss);
			})();
		</script>
	</body>
</html>
